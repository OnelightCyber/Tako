[package]
name = "tako-hook"
description = "Relays Claude Code hook events to Tako over a named pipe"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tako-hook"
path = "src/main.rs"

[dependencies]
serde_json = "1"
png = "0.17"
similar = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
