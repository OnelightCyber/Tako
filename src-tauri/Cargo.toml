[package]
name = "tako"
description = "Tako for Windows — watches your Claude Code sessions from the top of your screen"
authors = ["Onelight"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tako_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "process", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
similar = "2"
windows-collections = "0.2"
regex = "1"
windows = { version = "0.61", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_NetworkListManager",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "ApplicationModel",
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Media_Control",
  "Media_Core",
  "Media_SpeechRecognition",
  "Media_SpeechSynthesis",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
] }
